[package]
name = "audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The kira backend needs ALSA dev headers (alsa-lib-devel) to link on Linux
# (installed on the build box 2026-08-30); `--no-default-features` builds the
# silent no-op API on boxes without them.
default = ["backend"]
backend = ["dep:kira", "dep:symphonia", "dep:cpal"]

[dependencies]
kira = { workspace = true, optional = true }
# The output stream behind the watchdog (`src/output.rs`): the same cpal
# kira links.
cpal = { version = "0.15", optional = true }
symphonia = { version = "0.5", default-features = false, optional = true }
anyhow = { workspace = true }
pak = { path = "../pak" }
