[package]
name = "game"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
core = { path = "../core", features = ["route-fixtures"] }
bake = { path = "../bake" }
mungefs = { path = "../mungefs" }
sha2 = "0.10"

[dependencies]
image.workspace = true
core = { path = "../core" }
manifest = { path = "../manifest" }
pak = { path = "../pak" }
input = { path = "../input" }
render = { path = "../render" }
ui = { path = "../ui" }
audio = { path = "../audio" }
net = { path = "../net" }
glam.workspace = true
winit.workspace = true
# The menu cursor is an SVG, rendered at the display's size at startup (no fonts or images needed).
resvg = { version = "0.49", default-features = false }
gilrs.workspace = true
anyhow.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
gltf.workspace = true
ktx2.workspace = true
wgpu.workspace = true
# The shell movie's frames (card BSHLA): already in the tree through `image`.
zune-jpeg = "0.5"

# Keeping the display awake during a round (src/main/windowed/idle.rs): the
# Wayland uses the desktop session's idle service. X11 resets the screen saver.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android", target_os = "redox"))))'.dependencies]
zbus = "5.18"
x11rb = "0.13"

[features]
brain-shadow = ["core/brain-shadow"]
# Count every heap allocation, for `--bench` runs that report it (`game::alloc_count`).
alloc-count = []

[[bin]]
name = "game"
path = "src/main.rs"

# Phase C D14. The arena's acceptance is that two in-process runs are the same
# run, and the rig that has to be pinned is the example's own — so this one
# example is declared explicitly with `test = true` (every other example is
# still auto-discovered) and `cargo test` runs its `#[cfg(test)]` module.
[[example]]
name = "arena"
path = "examples/arena.rs"
test = true

[[example]]
name = "attachment_load_report"
path = "examples/attachment_load_report.rs"
test = true
